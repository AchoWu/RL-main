# Old-baseline conditional reverse OPD plus a KL penalty to the frozen initial
# student. Token-mean reduction is retained for the isolated ref-KL ablation.
defaults: distillation_math.yaml

loss_fn:
    zero_outside_topk: false
    reduction: "token_mean"
    reference_policy_kl_penalty: 0.01
    reference_policy_kl_type: "k3"
    reference_policy_kl_input_clamp: 20.0
    reference_policy_kl_output_clamp: 10.0
